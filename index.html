<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Light - slike na naslovnoj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f6f6f5;
    --fg: #111111;
    --muted: #5f5f5c;
    --line: rgba(0, 0, 0, 0.14);
    --frame: #ffffff;
    --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #f1f1ef;
      --muted: #a3a3a0;
      --line: rgba(255, 255, 255, 0.16);
      --frame: #1c1c1c;
      color-scheme: dark;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  body, h1, h2, p, figure, ol { margin: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1480px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 48px 80px;
    display: grid;
    gap: 72px;
  }

  header {
    display: grid;
    gap: 20px;
  }
  h1 {
    font-size: clamp(26px, 4vw, 36px);
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  nav ol {
    list-style: none;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  nav a {
    display: inline-block;
    padding: 6px 12px;
    border: 1px solid var(--line);
    color: var(--fg);
    text-decoration: none;
    font-size: 14px;
  }
  nav a:hover { border-color: var(--fg); }
  nav a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  figure {
    display: grid;
    gap: 20px;
    scroll-margin-top: 24px;
  }
  figcaption {
    display: grid;
    gap: 4px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  figcaption h2 {
    font-size: 20px;
    font-weight: 500;
    line-height: 1.3;
  }
  figcaption p {
    color: var(--muted);
    max-width: 72ch;
  }

  .shot {
    background: var(--frame);
    border: 1px solid var(--line);
    max-width: 100%;
  }
  .shot img {
    display: block;
    width: 100%;
    height: auto;
  }

  @media (max-width: 600px) {
    .page { gap: 48px; padding-block: 32px 56px; }
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>Naslovna stranica: kako prikazati cijele slike</h1>
    <nav aria-label="Opcije">
      <ol>
        <li><a href="#trenutna-situacija">Trenutna situacija</a></li>
        <li><a href="#opcija-1">1. Cijela slika na bijelom</a></li>
        <li><a href="#opcija-2">2. Cijela slika na sivom</a></li>
        <li><a href="#opcija-3">3. Prirodna visina</a></li>
        <li><a href="#opcija-4">4. Mutna pozadina</a></li>
        <li><a href="#opcija-5">5. Druga slika projekta</a></li>
        <li><a href="#opcija-6">6. Na sivom, slika lijevo</a></li>
      </ol>
    </nav>
  </header>

  <figure id="trenutna-situacija">
    <figcaption>
      <h2>Trenutna situacija</h2>
      <p>Svaka slika je izrezana da popuni okvir 16:9. Kod Narance (3:2), Tea i Komarne (kvadratne slike) odrezan je dio slike. Ostalih sest su vec 16:9.</p>
    </figcaption>
    <div class="shot"><img src="slike/0-trenutna-situacija.jpg" width="1440" height="1853" alt="Naslovna stranica sada: sve slike izrezane na 16:9"></div>
  </figure>

  <figure id="opcija-1">
    <figcaption>
      <h2>1. Cijela slika na bijelom</h2>
      <p>Okvir 16:9 ostaje, a slika se smanji da stane cijela, na sredini. Ostatak okvira je bijel, kao pozadina stranice.</p>
    </figcaption>
    <div class="shot"><img src="slike/1-na-bijelom.jpg" width="1440" height="1853" alt="Cijele slike na sredini bijelog okvira 16:9" loading="lazy"></div>
  </figure>

  <figure id="opcija-2">
    <figcaption>
      <h2>2. Cijela slika na sivom</h2>
      <p>Isto kao 1, ali je okvir svijetlosiv i oko slike je rub od 20 px. Sve slike imaju taj sivi okvir, pa izgledaju ujednaceno.</p>
    </figcaption>
    <div class="shot"><img src="slike/2-na-sivom.jpg" width="1440" height="1853" alt="Cijele slike na sredini svijetlosivog okvira 16:9" loading="lazy"></div>
  </figure>

  <figure id="opcija-3">
    <figcaption>
      <h2>3. Prirodna visina</h2>
      <p>Nema fiksnog okvira, svaka slika ima svoj omjer. Visina reda ide po najvisoj slici, a slike i nazivi su poravnati na dnu reda. Linije mreze ostaju gdje jesu.</p>
    </figcaption>
    <div class="shot"><img src="slike/3-prirodna-visina.jpg" width="1440" height="2096" alt="Slike u svom omjeru, poravnate na dnu svakog reda" loading="lazy"></div>
  </figure>

  <figure id="opcija-4">
    <figcaption>
      <h2>4. Mutna pozadina</h2>
      <p>Cijela slika je na sredini okvira 16:9, a prazne strane popunjava ista slika, uvecana i zamucena.</p>
    </figcaption>
    <div class="shot"><img src="slike/4-mutna-pozadina.jpg" width="1440" height="1853" alt="Cijele slike preko zamucene kopije iste slike u okviru 16:9" loading="lazy"></div>
  </figure>

  <figure id="opcija-5">
    <figcaption>
      <h2>5. Druga slika projekta</h2>
      <p>Raspored ostaje isti. Za naslovnu sliku uzima se prva slika projekta koja je 16:9, pa nista ne treba rezati. Naranca, Teo i Komarna dobiju svoju drugu sliku. Nove slike koje nisu 16:9 i dalje bi se rezale.</p>
    </figcaption>
    <div class="shot"><img src="slike/5-druga-slika.jpg" width="1440" height="1853" alt="Svaka naslovna slika je vec 16:9 i popunjava okvir" loading="lazy"></div>
  </figure>

  <figure id="opcija-6">
    <figcaption>
      <h2>6. Na sivom, slika lijevo</h2>
      <p>Isto kao 2, ali je slika uz lijevi rub umjesto na sredini, pa je poravnata s nazivom ispod.</p>
    </figcaption>
    <div class="shot"><img src="slike/6-na-sivom-lijevo.jpg" width="1440" height="1853" alt="Cijele slike u svijetlosivom okviru, poravnate lijevo" loading="lazy"></div>
  </figure>
</main>
</body>
</html>
